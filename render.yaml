services:
  - type: web
    name: nasa-mission-designer
    runtime: static
    buildCommand: echo "No build step needed"
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      # always check for the newest version, so visitors get updates right after a push
      - path: /*
        name: Cache-Control
        value: no-cache
